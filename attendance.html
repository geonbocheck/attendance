<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출결관리 시스템</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }

header { width: 100%; background: #16213e; padding: 16px 24px; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: 2px; border-bottom: 2px solid #0f3460; }

.clock { margin: 18px 0 8px; font-size: 36px; font-weight: 700; letter-spacing: 4px; color: #e94560; }
.date-str { font-size: 14px; color: #aaa; margin-bottom: 18px; }

.recent-logs { width: 320px; background: #16213e; border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; min-height: 60px; }
.recent-logs h3 { font-size: 13px; color: #aaa; margin-bottom: 8px; }
.log-item { font-size: 14px; padding: 4px 0; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; }
.log-item:last-child { border-bottom: none; }

.panel { background: #16213e; border-radius: 16px; padding: 24px; width: 320px; }
.display { background: #0f3460; border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 16px; min-height: 58px; position: relative; }
#numberDisplay { font-size: 32px; font-weight: 700; letter-spacing: 6px; min-height: 40px; }
#hint { color: #666; font-size: 14px; margin-top: 4px; }
#cursor { display: inline-block; width: 2px; height: 32px; background: #e94560; vertical-align: middle; animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key { background: #0f3460; border: none; color: #fff; font-size: 22px; font-weight: 600; padding: 18px; border-radius: 10px; cursor: pointer; transition: background .15s; }
.key:active, .key:hover { background: #e94560; }
.key.delete { background: #333; font-size: 16px; }
.key.enter  { background: #4CAF50; font-size: 16px; }
.key.outing { background: #FF9800; font-size: 16px; grid-column: span 3; }

/* 오버레이 */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; align-items: center; justify-content: center; }
.overlay.show { display: flex; }
.alert-box { background: #16213e; border-radius: 16px; padding: 32px 28px 20px; width: 300px; text-align: center; position: relative; border-top: 5px solid #4CAF50; overflow: hidden; }
.alert-icon { font-size: 52px; margin-bottom: 10px; }
.alert-name { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
.alert-msg  { font-size: 16px; color: #aaa; margin-bottom: 10px; }
.alert-memo { background: #0f3460; border-radius: 8px; padding: 10px 14px; font-size: 14px; color: #FFD700; margin: 8px 0; display: none; text-align: left; }
.alert-desk { background: #e94560; border-radius: 8px; padding: 10px 14px; font-size: 15px; font-weight: 700; margin: 8px 0; display: none; }
.alert-time { font-size: 13px; color: #666; margin-top: 10px; }
.alert-bar  { position: absolute; bottom: 0; left: 0; height: 4px; width: 100%; }
@keyframes shrink { from{width:100%} to{width:0} }

/* 토스트 */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #e94560; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 15px; display: none; z-index: 200; }
.toast.show { display: block; }

.all-logs-btn { margin: 18px 0; background: #0f3460; border: none; color: #aaa; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 14px; }

/* 전체 로그 모달 */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 300; align-items: flex-start; justify-content: center; padding-top: 40px; overflow-y: auto; }
.modal.show { display: flex; }
.modal-box { background: #16213e; border-radius: 16px; padding: 24px; width: 340px; max-height: 80vh; overflow-y: auto; }
.modal-box h2 { margin-bottom: 16px; }
.modal-close { float: right; background: #e94560; border: none; color: #fff; padding: 4px 12px; border-radius: 8px; cursor: pointer; }
.log-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #0f3460; font-size: 13px; }
</style>
</head>
<body>

<header>🏫 출결관리 시스템</header>

<div class="clock" id="clock">00:00:00</div>
<div class="date-str" id="dateStr"></div>

<div class="recent-logs">
  <h3>📋 최근 출결</h3>
  <div id="recentList"></div>
</div>

<div class="panel">
  <div class="display">
    <div id="numberDisplay"></div>
    <div id="hint">번호를 입력하세요</div>
    <span id="cursor"></span>
  </div>
  <div class="keypad">
    <button class="key" onclick="pressKey('1')">1</button>
    <button class="key" onclick="pressKey('2')">2</button>
    <button class="key" onclick="pressKey('3')">3</button>
    <button class="key" onclick="pressKey('4')">4</button>
    <button class="key" onclick="pressKey('5')">5</button>
    <button class="key" onclick="pressKey('6')">6</button>
    <button class="key" onclick="pressKey('7')">7</button>
    <button class="key" onclick="pressKey('8')">8</button>
    <button class="key" onclick="pressKey('9')">9</button>
    <button class="key delete" onclick="deleteKey()">지움</button>
    <button class="key" onclick="pressKey('0')">0</button>
    <button class="key enter" onclick="submitNumber()">입력</button>
    <button class="key outing" onclick="submitOuting()">🚶 외출</button>
  </div>
</div>

<button class="all-logs-btn" onclick="openAllLogs()">📂 전체 기록 보기</button>

<!-- 오버레이 -->
<div class="overlay" id="overlay" onclick="closeOverlay()">
  <div class="alert-box" id="alertBox" onclick="event.stopPropagation()">
    <div class="alert-icon" id="alertIcon">✅</div>
    <div class="alert-name" id="alertName"></div>
    <div class="alert-msg"  id="alertMsg"></div>
    <div class="alert-memo" id="alertMemo"></div>
    <div class="alert-desk" id="alertDesk">🙋 데스크에 문의하세요</div>
    <div class="alert-time" id="alertTime"></div>
    <div class="alert-bar"  id="alertBar"></div>
  </div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 전체 로그 모달 -->
<div class="modal" id="allLogsModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeAllLogs()">닫기</button>
    <h2>📂 전체 기록</h2>
    <div id="allLogsList"></div>
  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzymbqdFZ_wttpHiR-CoQEr-MV_D1lFgMsd3y3E7JRkeTkpUi2HYFTQXuL4ycG_cNXr/exec';
const AUTO_CLOSE = 4000;

let inputNumber  = '';
let isProcessing = false;
let overlayTimer = null;

/* ── 시계 ── */
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toTimeString().slice(0,8);
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('dateStr').textContent =
    now.getFullYear() + '년 ' + (now.getMonth()+1) + '월 ' + now.getDate() + '일 (' + days[now.getDay()] + ')';
}
setInterval(updateClock, 1000);
updateClock();

/* ── 키패드 ── */
function pressKey(k) {
  if (inputNumber.length >= 6) return;
  inputNumber += k;
  document.getElementById('numberDisplay').textContent = inputNumber;
  document.getElementById('hint').style.display = 'none';
  document.getElementById('cursor').style.display = 'none';
}
function deleteKey() {
  inputNumber = inputNumber.slice(0, -1);
  document.getElementById('numberDisplay').textContent = inputNumber;
  if (!inputNumber) {
    document.getElementById('hint').style.display = '';
    document.getElementById('cursor').style.display = '';
  }
}
document.addEventListener('keydown', function(e) {
  if (e.key >= '0' && e.key <= '9') pressKey(e.key);
  else if (e.key === 'Backspace') deleteKey();
  else if (e.key === 'Enter') submitNumber();
});

/* ── JSONP 호출 ── */
function callScript(number, action, callback) {
  const cbName = 'cb_' + Date.now();
  window[cbName] = function(result) {
    delete window[cbName];
    const s = document.getElementById('jsonp-script');
    if (s) s.remove();
    callback(result);
  };
  const script = document.createElement('script');
  script.id  = 'jsonp-script';
  script.src = SCRIPT_URL + '?callback=' + cbName + '&number=' + encodeURIComponent(number) + '&action=' + encodeURIComponent(action || '');
  document.body.appendChild(script);
}

/* ── 입력 제출 ── */
function submitNumber() {
  if (isProcessing) return;
  if (!inputNumber) { showError('번호를 입력해주세요'); return; }
  isProcessing = true;
  callScript(inputNumber, 'checkin', onResult);
}

/* ── 외출 ── */
function submitOuting() {
  if (isProcessing) return;
  if (!inputNumber) { showError('번호를 입력해주세요'); return; }
  isProcessing = true;
  callScript(inputNumber, 'outing', function(result) {
    isProcessing = false;
    inputNumber  = '';
    document.getElementById('numberDisplay').textContent = '';
    document.getElementById('hint').style.display = '';
    document.getElementById('cursor').style.display = '';
    if (!result.name) { playBeep('error'); showError(result.message || '등록되지 않은 번호입니다'); return; }
    showOverlay({
      icon  : '🚶',
      name  : result.name,
      msg   : '외출',
      memo  : '',
      desk  : false,
      time  : result.time || new Date().toTimeString().slice(0,8),
      color : '#FF9800'
    });
  });
}

/* ── 결과 처리 ── */
function onResult(result) {
  isProcessing = false;
  inputNumber  = '';
  document.getElementById('numberDisplay').textContent = '';
  document.getElementById('hint').style.display = '';
  document.getElementById('cursor').style.display = '';

  if (!result.success && !result.showDesk) {
    playBeep('error');
    showError(result.message || '오류가 발생했습니다');
    return;
  }

  showOverlay({
    icon  : result.showDesk ? '🚫' : '✅',
    name  : result.name  || '',
    msg   : result.showDesk ? '' : '체크 되었습니다',
    memo  : result.memo  || '',
    desk  : !!result.showDesk,
    time  : result.time  || new Date().toTimeString().slice(0,8),
    color : result.showDesk ? '#F44336' : '#4CAF50'
  });

  if (result.success) loadRecentLogs();
}

/* ── 오버레이 표시 ── */
function showOverlay(o) {
  playBeep(o.desk ? 'error' : 'success');

  document.getElementById('alertIcon').textContent = o.icon;
  document.getElementById('alertName').textContent = o.name;
  document.getElementById('alertMsg').textContent  = o.msg;

  const memoEl = document.getElementById('alertMemo');
  if (o.memo && o.memo.trim() !== '') {
    memoEl.textContent   = '📌 ' + o.memo;
    memoEl.style.display = 'block';
  } else {
    memoEl.style.display = 'none';
  }

  document.getElementById('alertDesk').style.display = o.desk ? 'block' : 'none';
  document.getElementById('alertTime').textContent   = o.time + ' 처리됨';
  document.getElementById('alertBox').style.borderTop = '5px solid ' + o.color;

  const bar = document.getElementById('alertBar');
  bar.style.background = o.color;
  bar.style.animation  = 'none';
  bar.offsetHeight;
  bar.style.animation  = 'shrink ' + AUTO_CLOSE + 'ms linear forwards';

  document.getElementById('overlay').classList.add('show');
  clearTimeout(overlayTimer);
  overlayTimer = setTimeout(closeOverlay, AUTO_CLOSE);
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
}

/* ── 소리 ── */
function playBeep(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = type === 'success' ? [523, 659, 784] : [300, 200];
    let t = ctx.currentTime;
    notes.forEach(function(freq) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq;
      o.start(t); o.stop(t + 0.15);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      t += 0.18;
    });
  } catch(e) {}
}

/* ── 토스트 ── */
function showError(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2500);
  isProcessing = false;
}

/* ── 최근 로그 ── */
function loadRecentLogs() {
  callScript('', 'recent', function(data) {
    const list = document.getElementById('recentList');
    if (!data || !data.logs || data.logs.length === 0) { list.innerHTML = '<div style="color:#666;font-size:13px">기록 없음</div>'; return; }
    list.innerHTML = data.logs.map(function(r) {
      return '<div class="log-item"><span>' + r.name + '</span><span style="color:#aaa">' + r.time + '</span></div>';
    }).join('');
  });
}
loadRecentLogs();

/* ── 전체 로그 ── */
function openAllLogs() {
  document.getElementById('allLogsModal').classList.add('show');
  callScript('', 'alllogs', function(data) {
    const list = document.getElementById('allLogsList');
    if (!data || !data.logs || data.logs.length === 0) { list.innerHTML = '<div style="color:#666">기록 없음</div>'; return; }
    list.innerHTML = data.logs.map(function(r) {
      return '<div class="log-row"><span>' + r.date + ' ' + r.time + '</span><span>' + r.name + '</span></div>';
    }).join('');
  });
}
function closeAllLogs() {
  document.getElementById('allLogsModal').classList.remove('show');
}
</script>
</body>
</html>
